services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: keystone_development
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/rails:cached
      - bundle:/usr/local/bundle
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      RAILS_ENV: development
      DATABASE_URL: postgres://postgres:postgres@db:5432/keystone_development
      QUEUE_DATABASE_URL: postgres://postgres:postgres@db:5432/keystone_development_queue
    tty: true
    stdin_open: true

  jobs:
    build:
      context: .
      dockerfile: Dockerfile.dev
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/rails:cached
      - bundle:/usr/local/bundle
    env_file:
      - path: .env
        required: false
    environment:
      RAILS_ENV: development
      DATABASE_URL: postgres://postgres:postgres@db:5432/keystone_development
      QUEUE_DATABASE_URL: postgres://postgres:postgres@db:5432/keystone_development_queue
    command: ["bin/jobs"]
    profiles: ["jobs"]

volumes:
  pg_data:
  bundle:
